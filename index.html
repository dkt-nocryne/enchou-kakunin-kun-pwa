<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>延長確認</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#161713">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="延長確認">
  <link rel="stylesheet" href="style.css?v=v23">
</head>

<body class="app-body luxury-body">
  <div class="app-container">
    <header class="app-header app-header--with-toggle">
      <div class="app-brand"><span class="brand-mark" aria-hidden="true">E</span><h1 class="app-title">延長確認</h1></div>
      <div class="header-toggle">
        <span class="toggle-text">カード</span>
        <label class="switch" aria-label="カード手数料">
          <input id="cardFeeToggle" type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <main class="app-main scroll">

      <div class="display-wrapper">
        <div class="luxury-caption">EXTENSION · COLLECTION</div>

        <div class="card price-card">
          <div class="card-label">現在の料金</div>
          <div id="currentChargeDisplay" class="card-amount">¥0</div>
          <div class="summary-foot"><span></span>現在のお会計<span></span></div>
        </div>

        <div class="extension-heading">延長後のお会計</div>
        <div id="extensionCards"></div>
        <div class="pricing-footer"><span id="cardFeeNote">カード手数料なし</span><span>延長確認</span></div>

      </div>

      <div class="spacer"></div>

      <div class="card">
        <label class="field-label" for="currentChargeInput">現在の料金</label>
        <div class="field-row field-row--stacked">
          <input id="currentChargeInput" type="number" inputmode="numeric" class="field-input right">
          <button id="currentChargeReset" class="btn secondary full" type="button">リセット</button>
        </div>
      </div>

      <div class="card counter-card">

        <div id="rowMaleCustomer" class="counter-row">
          <div class="counter-label"><span id="labelMaleCustomer">お客様（男性）</span></div>
          <div class="counter-controls">
            <button id="customerDec" class="btn small" type="button">-</button>
            <span id="customerCount" class="counter-value">0</span>
            <button id="customerInc" class="btn small" type="button">+</button>
          </div>
        </div>

        <div id="rowMainNomination" class="counter-row">
          <div class="counter-label"><span id="labelMainNomination">本指名</span></div>
          <div class="counter-controls">
            <button id="mainNominationDec" class="btn small" type="button">-</button>
            <span id="mainNominationCount" class="counter-value">0</span>
            <button id="mainNominationInc" class="btn small" type="button">+</button>
          </div>
        </div>

        <div id="rowInhouseNomination" class="counter-row">
          <div class="counter-label"><span id="labelInhouseNomination">場内指名</span></div>
          <div class="counter-controls">
            <button id="inhouseNominationDec" class="btn small" type="button">-</button>
            <span id="inhouseNominationCount" class="counter-value">0</span>
            <button id="inhouseNominationInc" class="btn small" type="button">+</button>
          </div>
        </div>

        <div id="rowFemaleCustomer" class="counter-row">
          <div class="counter-label"><span id="labelFemaleCustomer">お客様（女性）</span></div>
          <div class="counter-controls">
            <button id="femaleDec" class="btn small female" type="button">-</button>
            <span id="femaleCustomerCount" class="counter-value">0</span>
            <button id="femaleInc" class="btn small female" type="button">+</button>
          </div>
        </div>

      </div>

      <div class="spacer"></div>

      <button class="btn primary full" type="button" onclick="location.href='settings.html'">料金設定</button>

    </main>
  </div>

  <script src="app.js?v=v23"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initApp);

    window.addEventListener('pageshow', () => {
      if (typeof updateCalculator === 'function') updateCalculator();
    });
  </script>
</body>

</html>
